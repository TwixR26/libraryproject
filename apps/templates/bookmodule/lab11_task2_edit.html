{% extends "layouts/base.html" %}
{% block content %}
<h2>Edit Student: {{ student.name }}</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <p><em>Hold down "Control", or "Command" on a Mac, to select more than one address.</em></p>
    <button type="submit">Update Student</button>
    <a href="{% url 'lab11_task2.list' %}">Cancel</a>
</form>
{% endblock %}
